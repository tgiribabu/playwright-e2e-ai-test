# GENERATED by scripts/ai/sync.mjs from ai/playbooks/review-change.md. Do not edit: change the source, then run `npm run ai:sync`.
description = "Review a change against the project rules before merging"
prompt = """
Follow AGENTS.md and the playbook below.

Task: {{args}}

# Playbook: review a change
Run `npm run verify` and read `git diff`. Block the change if any of these is true:
1. An assertion was removed, loosened, or an expected value changed without stated evidence.
2. A selector appears outside a `.locators.ts` file, or XPath / `:nth-child` / generated ids were added.
3. Fixed waits, bigger timeouts, extra retries, or `test.skip/fixme/only` were added.
4. Created data has no `cleanup.add`; SQL is concatenated; SOQL is built without the `soql` template.
5. A tenant-specific value is hard-coded; a secret value appears anywhere; read-only protections were weakened.
6. Generated AI adapter files were edited by hand (`npm run ai:check` fails).
Output: verdict (approve / request changes) and findings as `file:line | problem | fix`.
"""
